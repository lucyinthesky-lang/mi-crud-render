<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CRUD en Render</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="site-container">
        <div class="header">
            <img src="logo.png" alt="Logo" class="logo">
            <h1>Gestión de Registros</h1>
        </div>

        <main class="content">
            <a href="https://www.youtube.com/watch?v=dQw4W9WgXcQ" target="_blank" class="stream-link">
                🎬 Ver Video en Streaming
            </a>

            <div class="crud-panel">
                <button id="addBtn" class="btn primary">+ Nuevo Registro</button>
                <table id="recordsTable">
                    <thead><tr><th>ID</th><th>Nombre</th><th>Email</th><th>Acciones</th></tr></thead>
                    <tbody></tbody>
                </table>
            </div>
        </main>

        <div id="formModal" class="modal hidden">
            <div class="modal-content">
                <h2 id="modalTitle">Nuevo Registro</h2>
                <input type="hidden" id="recordId">
                <input type="text" id="name" placeholder="Nombre completo" required>
                <input type="email" id="email" placeholder="Correo electrónico" required>
                <div class="modal-actions">
                    <button id="saveBtn" class="btn primary">Guardar</button>
                    <button id="cancelBtn" class="btn secondary">Cancelar</button>
                </div>
            </div>
        </div>

        <div class="footer">
            <p><strong>Curso:</strong> Servicios en la Nube</p>
            <p><strong>Nombre:</strong> [Tu Nombre Completo]</p>
            <p><strong>Código:</strong> [Tu Código]</p>
            <p><strong>Contacto:</strong> <a href="mailto:tu.correo@dominio.com">tu.correo@dominio.com</a></p>
        </div>
    </div>
    <script src="app.js"></script>
</body>
</html>
